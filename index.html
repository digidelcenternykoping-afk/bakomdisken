<title>Bakom disken</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #eef1ec;
    --surface: #ffffff;
    --surface-2: #e4e9e2;
    --ink: #1b2422;
    --ink-soft: #4b5650;
    --ink-faint: #7c8880;
    --accent: #1f6f64;
    --accent-deep: #123f39;
    --accent-ink: #ffffff;
    --brass: #a8762f;
    --line: #c9d2c7;
    --calm: #3f8f5f;
    --agitated: #b9791f;
    --hostile: #b3402f;
    --shadow: 0 1px 2px rgba(18, 30, 27, 0.06), 0 8px 24px -12px rgba(18, 30, 27, 0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101917;
      --surface: #16211f;
      --surface-2: #1d2a27;
      --ink: #e7ece8;
      --ink-soft: #a9b6af;
      --ink-faint: #718079;
      --accent: #4cbba9;
      --accent-deep: #2e8577;
      --accent-ink: #08201b;
      --brass: #d8a857;
      --line: #2b3835;
      --calm: #5cb37e;
      --agitated: #e0a94b;
      --hostile: #e07361;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101917;
    --surface: #16211f;
    --surface-2: #1d2a27;
    --ink: #e7ece8;
    --ink-soft: #a9b6af;
    --ink-faint: #718079;
    --accent: #4cbba9;
    --accent-deep: #2e8577;
    --accent-ink: #08201b;
    --brass: #d8a857;
    --line: #2b3835;
    --calm: #5cb37e;
    --agitated: #e0a94b;
    --hostile: #e07361;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, "Times New Roman", serif; text-wrap: balance; margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace; }
  button { font-family: inherit; }
  a { color: var(--accent-deep); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app-shell { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark { font-family: "IBM Plex Mono"; font-size: 12px; letter-spacing: 0.08em; color: var(--brass); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
  .brand h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mode-badge { font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); background: var(--surface); }
  .mode-badge.on { color: var(--accent-deep); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .theme-toggle { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .theme-toggle button { border: none; background: transparent; color: var(--ink-soft); font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .theme-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* ---------- Home view ---------- */
  .intro { max-width: 62ch; margin-bottom: 30px; }
  .intro h2 { font-size: 28px; font-weight: 600; margin-bottom: 10px; }
  .intro p { color: var(--ink-soft); margin: 0 0 8px; }
  .intro details { margin-top: 14px; color: var(--ink-soft); }
  .intro summary { cursor: pointer; color: var(--accent-deep); font-weight: 500; }
  .intro summary::marker { color: var(--accent); }
  .intro details p { margin-top: 8px; }

  .ai-settings { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 2px 16px; box-shadow: var(--shadow); }
  .ai-settings summary { cursor: pointer; padding: 12px 0; font-weight: 600; color: var(--accent-deep); list-style: none; }
  .ai-settings summary::-webkit-details-marker { display: none; }
  .ai-settings summary::before { content: "⚙ "; }
  .ai-settings-body { padding: 2px 0 16px; }
  .ai-settings-body > p { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 14px; }
  .ai-settings-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; max-width: 420px; }
  .ai-settings-row label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .ai-settings-row input, .ai-settings-row select {
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px;
    background: var(--paper); color: var(--ink); font-family: inherit;
  }
  .ai-settings-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .ai-settings-note { font-size: 13px; min-height: 18px; margin: 0 0 10px; font-weight: 600; }
  .ai-settings-note.ok { color: var(--calm); }
  .ai-settings-note.err { color: var(--hostile); }
  .ai-settings-fine { font-size: 12px; color: var(--ink-faint); margin: 0; line-height: 1.5; max-width: 60ch; }
  .ai-settings-fine a { color: var(--ink-faint); }

  .case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
  .case-card {
    text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow); transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .case-card:hover, .case-card:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) { .case-card { transition: none; } .case-card:hover { transform: none; } }
  .case-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .call-number { font-family: "IBM Plex Mono"; font-size: 11px; letter-spacing: 0.04em; color: var(--brass); }
  .difficulty { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
  .case-card h3 { font-size: 18px; font-weight: 600; }
  .case-tag { font-size: 12.5px; color: var(--ink-soft); }
  .case-card .case-blurb { font-size: 13.5px; color: var(--ink-soft); flex-grow: 1; }
  .case-card .go { font-size: 13px; color: var(--accent-deep); font-weight: 600; }

  /* ---------- Briefing view ---------- */
  .briefing-card { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 28px 24px; box-shadow: var(--shadow); }
  .briefing-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .briefing-card h2 { font-size: 24px; }
  .briefing-meta { color: var(--ink-faint); font-size: 13.5px; margin-bottom: 18px; }
  .briefing-card p { color: var(--ink-soft); margin: 0 0 14px; }
  .goal-box { background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 14px; color: var(--ink); margin-bottom: 20px; }
  .goal-box strong { color: var(--accent-deep); }
  .briefing-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--line); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------- Session view ---------- */
  .session { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 720px) { .session { grid-template-columns: 1fr; } }

  .case-file { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); position: sticky; top: 16px; }
  .case-file h3 { font-size: 17px; margin-bottom: 2px; }
  .case-file .case-tag { display: block; margin-bottom: 14px; }
  .meter-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-faint); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .meter-track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-bottom: 4px; }
  .meter-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease, background-color 0.4s ease; }
  @media (prefers-reduced-motion: reduce) { .meter-fill { transition: none; } }
  .meter-band { font-weight: 600; font-size: 14px; margin-bottom: 16px; }
  .turn-count { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .turn-count .mono { color: var(--ink); }

  .chat-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 480px; }
  .chat-log { flex-grow: 1; padding: 18px 18px 6px; display: flex; flex-direction: column; gap: 12px; max-height: 56vh; overflow-y: auto; }
  .bubble-row { display: flex; }
  .bubble-row.visitor { justify-content: flex-start; }
  .bubble-row.player { justify-content: flex-end; }
  .bubble-col { max-width: 78%; display: flex; flex-direction: column; }
  .bubble-row.visitor .bubble-col { align-items: flex-start; }
  .bubble-row.player .bubble-col { align-items: flex-end; }
  .bubble { padding: 10px 13px; border-radius: 12px; font-size: 14.5px; }
  .bubble-row.visitor .bubble { background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 3px; }
  .bubble-row.player .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
  .bubble-name { display: block; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px; }
  .bubble-row.player .bubble-name { color: rgba(255,255,255,0.75); text-align: right; }
  .turn-meta { font-family: "IBM Plex Mono"; font-size: 11px; margin-top: 4px; padding: 0 2px; }
  .narrator-row { text-align: center; padding: 10px 8px 2px; }
  .narrator-text { font-family: "Fraunces", serif; font-style: italic; color: var(--ink-soft); font-size: 14.5px; max-width: 46ch; margin: 0 auto; }
  .narrator-text.error-text { font-family: "Public Sans", sans-serif; font-style: normal; color: var(--hostile); }

  .typing-dots { display: inline-flex; gap: 4px; align-items: center; height: 14px; padding: 3px 2px; }
  .typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-faint); animation: typingPulse 1.2s infinite ease-in-out; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingPulse { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .typing-dots span { animation: none; opacity: 0.6; } }

  .composer { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea {
    flex-grow: 1; resize: none; border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
    color: var(--ink); font-family: inherit; font-size: 14.5px; padding: 10px 12px; min-height: 44px; max-height: 140px;
  }
  .composer textarea:disabled { opacity: 0.5; }
  .bubble { white-space: pre-line; }
  .mic-btn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .mic-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .mic-btn.listening { background: var(--hostile); border-color: var(--hostile); color: #fff; }
  .mic-btn.listening .mic-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: micPulse 1s infinite ease-in-out; }
  @keyframes micPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .mic-btn.listening .mic-dot { animation: none; } }
  .mic-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 14px 12px; font-size: 12.5px; color: var(--ink-faint); }
  .mic-bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .mic-status { margin: 0; min-height: 18px; }
  .mic-status.err { color: var(--hostile); font-weight: 600; }
  .mic-status.live { color: var(--accent-deep); font-weight: 600; }
  @media (max-width: 520px) { .mic-btn .mic-label { display: none; } }
  .session-actions { display: flex; justify-content: space-between; margin-top: 10px; }

  /* ---------- Report view ---------- */
  .report-card { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 26px 28px; box-shadow: var(--shadow); }
  .end-banner { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 14px; }
  .end-banner .dot { width: 8px; height: 8px; border-radius: 50%; }
  .report-card h2 { font-size: 23px; margin-bottom: 10px; }
  .report-narrative { color: var(--ink-soft); margin: 0 0 22px; }

  .spark-wrap { margin-bottom: 24px; }
  .spark-wrap .meter-label { margin-bottom: 8px; }
  svg.sparkline { width: 100%; height: 64px; display: block; }

  .tally-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 22px; }
  @media (max-width: 480px) { .tally-cols { grid-template-columns: 1fr; } }
  .tally-col h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 8px; }
  .tally-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .tally-col li { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .tally-col .tally-name { color: var(--ink); }
  .tally-col .tally-count { font-family: "IBM Plex Mono"; color: var(--ink-faint); }
  .tally-empty { font-size: 13.5px; color: var(--ink-faint); font-style: italic; }
  .debrief-list li { display: block; }

  .tip-box { background: var(--surface-2); border-left: 3px solid var(--brass); border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 14px; margin-bottom: 22px; }
  .tip-box strong { color: var(--brass); }
  .tip-box.err { border-left-color: var(--hostile); }
  .tip-box.err strong { color: var(--hostile); }

  .report-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }

  .transcript-toggle summary { cursor: pointer; color: var(--accent-deep); font-weight: 600; font-size: 13.5px; list-style: none; }
  .transcript-toggle summary::-webkit-details-marker { display: none; }
  .transcript-toggle summary::before { content: "▸ "; }
  .transcript-toggle[open] summary::before { content: "▾ "; }
  .transcript-toggle { border-top: 1px solid var(--line); padding-top: 16px; }
  .transcript-log { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; max-height: 50vh; overflow-y: auto; padding-right: 4px; }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">HTG 03</span>
      <h1>Bakom disken</h1>
    </div>
    <div class="topbar-right">
      <span class="mode-badge" id="mode-badge">Regelbaserat</span>
      <div class="theme-toggle" role="group" aria-label="Färgtema">
        <button type="button" data-theme-choice="light" aria-pressed="false">Ljust</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Mörkt</button>
        <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
      </div>
    </div>
  </div>

  <main id="view-root"></main>
</div>

<script>
(function () {
  "use strict";

  /* ============ THEME ============ */
  var root = document.documentElement;
  function applyTheme(choice) {
    if (choice === "light" || choice === "dark") root.setAttribute("data-theme", choice);
    else root.removeAttribute("data-theme");
    document.querySelectorAll(".theme-toggle button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.themeChoice === choice));
    });
  }
  document.querySelectorAll(".theme-toggle button").forEach(function (b) {
    b.addEventListener("click", function () { applyTheme(b.dataset.themeChoice); });
  });
  applyTheme("system");

  /* ============ AI ENGINE CONFIG ============ */
  // ---------------------------------------------------------------------
  // Den här filen innehåller ALDRIG någon Anthropic API-nyckel. AI-läget
  // pratar istället med en liten proxy (en Cloudflare Worker) som du äger
  // och som håller den riktiga nyckeln hemlig på serversidan. Kollegor som
  // vill använda AI-läget skriver bara in ett delat lösenord i appen –
  // det lösenordet kontrolleras av Workern, aldrig av den här filen.
  //
  // INNAN du publicerar filen: klistra in URL:en till din driftsatta
  // Cloudflare Worker mellan citattecknen nedan (t.ex.
  // "https://bakom-disken-proxy.dittnamn.workers.dev"). Se den separata
  // worker.js-filen för själva proxykoden och driftsättningsinstruktioner.
  // En URL är inte hemlig, så det är säkert att den ligger i klartext här.
  // ---------------------------------------------------------------------
  var WORKER_URL = "https://bakom-disken-proxy.digidelcenternykoping.workers.dev";

  // Lösenordet skrivs in av användaren i appen och lever bara i minnet så
  // länge sidan är öppen – det sparas aldrig, och skickas bara vidare till
  // din egen Worker (aldrig till Anthropic direkt).
  var aiConfig = {
    password: "",
    model: "claude-haiku-4-5",
    enabled: false
  };

  function apiHeaders() {
    return {
      "content-type": "application/json",
      "x-app-password": aiConfig.password
    };
  }

  function summarizeApiError(status, bodyText) {
    var msg = "";
    try {
      var parsed = JSON.parse(bodyText);
      if (parsed && parsed.error && parsed.error.message) msg = parsed.error.message;
    } catch (e) { /* ignore parse failure */ }
    if (status === 401) return "Fel lösenord (401). Kontrollera att du skrivit in det korrekt.";
    if (status === 429) return "För många förfrågningar just nu (429) – vänta en liten stund och försök igen.";
    if (status === 529 || status === 503) return "Tjänsten är överbelastad just nu – försök igen om en stund.";
    if (status === 400) return "Felaktig förfrågan (400)" + (msg ? ": " + msg : ".");
    return "API-fel (" + status + ")" + (msg ? ": " + msg : ".");
  }

  function friendlyNetworkError(err) {
    var raw = err && err.message ? err.message : "Ett okänt fel inträffade.";
    if (raw.indexOf("Failed to fetch") !== -1 || raw.indexOf("NetworkError") !== -1) {
      if (!WORKER_URL.trim()) {
        return "AI-motorn är inte konfigurerad ännu – ingen Worker-adress är ifylld i filens källkod (WORKER_URL). Grundläget fungerar dock som vanligt.";
      }
      return "Kunde inte nå AI-tjänsten. Kontrollera internetanslutningen och att Worker-adressen (" + WORKER_URL + ") är korrekt driftsatt och tillåter anrop härifrån (CORS).";
    }
    return raw;
  }

  var VISITOR_TOOL = {
    name: "visitor_turn",
    description: "Generera besökarens nästa replik och uppdatera samtalsläget utifrån bibliotekariens senaste svar.",
    input_schema: {
      type: "object",
      properties: {
        reply: { type: "string", description: "Besökarens nästa replik på naturlig, talad svenska. 1-4 meningar. Stanna helt i karaktär, bryt aldrig illusionen och nämn aldrig att du är en AI." },
        anger: { type: "integer", description: "Besökarens känslomässiga temperatur just nu, 0-100. 0 = helt lugn och nöjd. 100 = extremt hotfull, kräver ingripande. Utgå ifrån den tidigare temperaturen och justera realistiskt utifrån hur bra eller dåligt bibliotekariens SENASTE svar togs emot – variera hur mycket den ändras beroende på hur starkt eller svagt svaret faktiskt var." },
        resolved: { type: "boolean", description: "true endast om besökaren nu känner sig hörd, situationen är hanterad i sak och samtalet naturligt kan avslutas positivt." },
        signal: { type: "string", description: "En kort, saklig sammanfattning (max 6 ord, på svenska) av vad i bibliotekariens svar som drev förändringen, t.ex. \"Konkret lösning och ägande av misstaget\" eller \"Uppfattades som avfärdande\"." },
        endingNarrative: { type: "string", description: "ENDAST om resolved är true eller temperaturen nu är 95 eller högre: en kort skildring i tredje person (2-3 meningar, på svenska) av hur mötet avslutas. Lämna tomt annars." }
      },
      required: ["reply", "anger", "resolved", "signal"]
    }
  };

  var DEBRIEF_TOOL = {
    name: "debrief",

  function buildSystemPrompt(visitor) {
    return [
      "Du styr en rollspelad NPC i en träningssimulator för bibliotekspersonal som övar på att möta arga, upprörda eller regelbrytande besökare i biblioteket.",
      (visitor.aiRole || ("Du spelar besökaren " + visitor.name + " (" + visitor.age + " år).")) + " Bakgrund: " + visitor.briefing,
      "Vad som särskilt påverkar " + visitor.name + ": " + visitor.aiNotes,
      "Starttemperatur innan bibliotekariens första svar: " + visitor.initialAnger + "/100.",
      "Regler: Svara ALLTID på svenska, helt i karaktär som " + visitor.name + ", aldrig som en AI-assistent. Håll repliker korta och naturliga (1-4 meningar), som riktigt talspråk. Bedöm bibliotekariens senaste svar realistiskt utifrån innehåll och ton, inte bara enskilda ord: genuin empati, ägande av misstag och konkreta lösningar sänker temperaturen; avfärdande, skuldbeläggande, hot i förtid eller respektlöshet höjer den. Variera hur mycket temperaturen ändras beroende på hur starkt eller svagt svaret faktiskt är – ett medioker svar bör knappt ändra läget, ett riktigt bra eller riktigt dåligt svar bör ändra det tydligt. Du måste alltid svara genom verktyget visitor_turn, aldrig som vanlig text."
    ].join("\n\n");
  }

  function buildTranscript(session) {
    return session.messages
      .filter(function (m) { return m.role === "visitor" || m.role === "player"; })
      .map(function (m) { return (m.role === "visitor" ? "Besökaren" : "Bibliotekarien") + ": " + m.text; })
      .join("\n");
  }

  async function anthropicToolCall(system, userContent, tool) {
    var body = {
      model: aiConfig.model,
      max_tokens: 700,
      system: system,
      messages: [{ role: "user", content: userContent }],
      tools: [tool],
      tool_choice: { type: "tool", name: tool.name }
    };
    var res;
    try {
      res = await fetch(WORKER_URL, { method: "POST", headers: apiHeaders(), body: JSON.stringify(body) });
    } catch (err) {
      throw new Error(friendlyNetworkError(err));
    }
    if (!res.ok) {
      var bodyText = await res.text().catch(function () { return ""; });
      throw new Error(summarizeApiError(res.status, bodyText));
    }
    var data = await res.json();
    var toolBlock = (data.content || []).find(function (b) { return b.type === "tool_use"; });
    if (!toolBlock) throw new Error("Fick inget strukturerat svar från AI:n. Försök igen.");
    return toolBlock.input;
  }

  function callVisitorTurn(visitor, session, playerText) {
    var transcriptSoFar = buildTranscript(session);
    var userContent =
      "Samtalet hittills:\n" + transcriptSoFar +
      "\nBibliotekarien: " + playerText +
      "\n\nNuvarande temperatur innan detta svar: " + session.anger + "/100. Detta är replik " + (session.turn + 1) + " av " + session.maxTurns + ".\n\n" +
      "Svara nu som " + visitor.name + " genom verktyget visitor_turn.";
    return anthropicToolCall(buildSystemPrompt(visitor), userContent, VISITOR_TOOL);
  }

  function fallbackEndingNarrative(visitor, endingKey) {
    if (endingKey === "improved") return visitor.name + " verkar lugnare än vid samtalets start, men ni hann inte landa i en fullständig lösning innan tiden tog slut.";
    return visitor.name + " lämnar samtalet fortfarande tydligt upprörd. Situationen är inte löst inom den tid ni hade – det kan behöva följas upp.";
  }

    }
    return (
      '<div class="mic-bar">' +
        '<p class="mic-status" id="mic-status" aria-live="polite"></p>' +
        '<label><input type="checkbox" id="mic-autosend"' + (micPrefs.autoSend ? " checked" : "") + (locked ? " disabled" : "") + '> Skicka direkt när jag pratat klart</label>' +
      '</div>'
    );
  }

  /* ============ STATE ============ */
  var state = { view: "home", visitor: null, session: null };

  function newSession(visitor) {
    return {
      anger: visitor.initialAnger,
      turn: 0,
      maxTurns: 8,
      messages: [{ role: "visitor", text: visitor.opening }],
      angerHistory: [visitor.initialAnger],
      tally: {},
      bandQueues: {},
      bandLast: {},
      pending: false,
      draftText: null,
      ended: false,
      endingKey: null,
      endingNarrative: null,
      debrief: null,
      debriefLoading: false,
      debriefError: null
    };
  }

  // Fisher-Yates shuffle of [0..n-1], nudged so it never opens with the line
  // that was just shown (avoids an immediate repeat across a queue refill).
  function shuffledIndices(n, avoid) {
    var arr = [];
    for (var i = 0; i < n; i++) arr.push(i);
    for (var i2 = arr.length - 1; i2 > 0; i2--) {
      var j = Math.floor(Math.random() * (i2 + 1));
      var tmp = arr[i2]; arr[i2] = arr[j]; arr[j] = tmp;
    }
    if (arr.length > 1 && avoid != null && arr[0] === avoid) {
      var t = arr[0]; arr[0] = arr[1]; arr[1] = t;
    }
    return arr;
  }

  // Each visitor line within a band is shown once before any line repeats,
  // instead of picking uniformly at random (which could echo the same one or
  // two lines back to back purely by chance).
  function pickLine(visitor, band, session) {
    var lines = visitor.bands[band];
    if (!session.bandQueues[band] || session.bandQueues[band].length === 0) {
      session.bandQueues[band] = shuffledIndices(lines.length, session.bandLast[band]);
    }
    var idx = session.bandQueues[band].shift();
    session.bandLast[band] = idx;
    return lines[idx];
  }

  function addTally(session, tags) {
    Object.keys(tags).forEach(function (k) { session.tally[k] = (session.tally[k] || 0) + tags[k]; });
  }

  /* ============ RENDER ============ */
  var rootEl = document.getElementById("view-root");

  function updateModeBadge() {
    var badge = document.getElementById("mode-badge");
    if (!badge) return;
    if (aiConfig.enabled) {
      var modelLabel = aiConfig.model === "claude-sonnet-5" ? "Sonnet 5" : "Haiku 4.5";
      badge.textContent = "AI-motor (" + modelLabel + ")";
      badge.classList.add("on");
    } else {
      badge.textContent = "Regelbaserat";
      badge.classList.remove("on");
    }
  }

  function render() {
    stopSpeech(true);
    updateModeBadge();
    if (state.view === "home") renderHome();
    else if (state.view === "briefing") renderBriefing();
    else if (state.view === "session") renderSession();
    else if (state.view === "report") renderReport();
  }

  function escapeHtml(str) {
    var d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function renderHome() {
    var cards = VISITORS.map(function (v) {
      return (
        '<button class="case-card" data-visitor="' + v.id + '" type="button">' +
          '<div class="case-card-top"><span class="call-number mono">' + v.callNumber + '</span>' +
          '<span class="difficulty">' + difficultyOf(v) + '</span></div>' +
          '<h3>' + v.name + ', ' + v.age + '</h3>' +
          '<span class="case-tag">' + v.tag + '</span>' +
          '<p class="case-blurb">' + v.blurb + '</p>' +
          '<span class="go">Starta samtal →</span>' +
        '</button>'
      );
    }).join("");

    rootEl.innerHTML =
      '<div class="intro">' +
        '<h2>Öva på svåra möten i informationsdisken</h2>' +
        '<p>' + NUM_SV[VISITORS.length] + ' besökare, ' + NUM_SV[VISITORS.length].toLowerCase() + ' olika situationer. Du svarar genom att skriva eller prata in med mikrofonknappen, och besökaren reagerar utifrån vad – och hur – du säger. Efter varje samtal får du en kort rapport över vad som fungerade och vad du kan öva vidare på.</p>' +
        '<details><summary>Så fungerar det</summary>' +
          '<p>Varje besökare har en inre “temperatur” som stiger eller sjunker beroende på ditt svar: empati, konkreta lösningar och ett lugnt tonläge sänker temperaturen, medan avfärdanden, skuldbeläggande och hot i förtid höjer den. Samtalet tar slut när besökaren lugnat ner sig, situationen eskalerar, eller efter åtta repliker. I <strong>regelbaserat läge</strong> avgörs det av nyckelord i din text. I <strong>AI-läge</strong> spelas besökaren live av Claude, som förstår innebörden i det du skriver – inte bara enskilda ord.</p>' +
        '</details>' +
        renderAiSettingsHtml() +
      '</div>' +
      '<div class="case-grid">' + cards + '</div>';

    rootEl.querySelectorAll(".case-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var v = VISITORS.find(function (x) { return x.id === btn.dataset.visitor; });
        state.visitor = v;
        state.view = "briefing";
        render();
      });
    });

    wireAiSettings();
  }

  function renderAiSettingsHtml() {
    var notConfigured = !WORKER_URL.trim();
    var configWarning = notConfigured
      ? '<p class="ai-settings-note err">⚠ AI-motorn är inte konfigurerad i den här kopian ännu (ingen Worker-adress ifylld). Grundläget nedan fungerar som vanligt.</p>'
      : "";
    var finePrint = 'Lösenordet skickas bara till bibliotekets egen AI-tjänst (en Cloudflare Worker) som håller den riktiga Anthropic-nyckeln hemlig på serversidan – ingen nyckel finns i den här filen, och lösenordet sparas aldrig, bara i minnet så länge sidan är öppen. Fråga den som satte upp tjänsten om lösenordet om du inte har det.';

    return (
      '<details class="ai-settings" id="ai-settings"' + (aiConfig.enabled ? ' open' : '') + '>' +
        '<summary>AI-motor &amp; inställningar</summary>' +
        '<div class="ai-settings-body">' +
          '<p>Som standard körs besökarna av en inbyggd regelmotor, helt offline. Vill du istället att besökarna spelas live av Claude – med äkta språkförståelse istället för nyckelordsmatchning – skriv in det delade lösenordet nedan.</p>' +
          configWarning +
          '<div class="ai-settings-row">' +
            '<label for="ai-key-input">Lösenord</label>' +
            '<input type="password" id="ai-key-input" placeholder="Lösenord från biblioteket" autocomplete="off" value="' + escapeHtml(aiConfig.password) + '">' +
          '</div>' +
          '<div class="ai-settings-row">' +
            '<label for="ai-model-select">Modell</label>' +
            '<select id="ai-model-select">' +
              '<option value="claude-haiku-4-5"' + (aiConfig.model === "claude-haiku-4-5" ? " selected" : "") + '>Claude Haiku 4.5 – snabb &amp; billig (rekommenderas)</option>' +
              '<option value="claude-sonnet-5"' + (aiConfig.model === "claude-sonnet-5" ? " selected" : "") + '>Claude Sonnet 5 – bättre kvalitet, dyrare</option>' +
            '</select>' +
          '</div>' +
          '<div class="ai-settings-actions">' +
            '<button class="btn btn-primary" id="ai-enable-btn" type="button">Aktivera AI-motor</button>' +
            '<button class="btn btn-ghost" id="ai-disable-btn" type="button"' + (aiConfig.enabled ? "" : " disabled") + '>Stäng av, kör regelbaserat</button>' +
          '</div>' +
          '<p class="ai-settings-note" id="ai-settings-msg"></p>' +
          '<p class="ai-settings-fine">' + finePrint + '</p>' +
        '</div>' +
      '</details>'
    );
  }

  function wireAiSettings() {
    var enableBtn = document.getElementById("ai-enable-btn");
    var disableBtn = document.getElementById("ai-disable-btn");
    var msg = document.getElementById("ai-settings-msg");
    if (!enableBtn) return;
    enableBtn.addEventListener("click", function () {
      var password = document.getElementById("ai-key-input").value.trim();
      var model = document.getElementById("ai-model-select").value;
      if (!password) {
        msg.textContent = "Ange lösenordet för att aktivera AI-motorn.";
        msg.className = "ai-settings-note err";
        return;
      }
      aiConfig.password = password;
      aiConfig.model = model;
      aiConfig.enabled = true;
      msg.textContent = "AI-motorn är aktiv. Nya samtal spelas nu av Claude.";
      msg.className = "ai-settings-note ok";
      disableBtn.disabled = false;
      updateModeBadge();
    });
    disableBtn.addEventListener("click", function () {
      aiConfig.enabled = false;
      msg.textContent = "AI-motorn är avstängd. Nya samtal körs regelbaserat och offline igen.";
      msg.className = "ai-settings-note ok";
      disableBtn.disabled = true;
      updateModeBadge();
    });
  }

  function renderBriefing() {
    var v = state.visitor;
    rootEl.innerHTML =
      '<div class="briefing-card">' +
        '<div class="briefing-head"><h2>' + v.name + ', ' + v.age + '</h2>' +
        '<span class="call-number mono">' + v.callNumber + '</span></div>' +
        '<div class="briefing-meta">' + v.tag + ' &middot; Svårighetsgrad: ' + difficultyOf(v) + '</div>' +
        '<p>' + v.briefing + '</p>' +
        '<div class="goal-box"><strong>Öva på:</strong> ' + v.goal + '</div>' +
        '<div class="briefing-actions">' +
          '<button class="btn btn-primary" id="start-btn" type="button">Börja samtalet</button>' +
          '<button class="btn btn-ghost" id="back-btn" type="button">Tillbaka till alla besökare</button>' +
        '</div>' +
      '</div>';
    document.getElementById("start-btn").addEventListener("click", function () {
      state.session = newSession(v);
      state.view = "session";
      render();
    });
    document.getElementById("back-btn").addEventListener("click", function () {
      state.view = "home"; render();
    });
  }

  function turnMetaHtml(label, delta) {
    var sign = delta > 0 ? "+" : "";
    var toneVar = delta < 0 ? "var(--calm)" : (delta > 0 ? "var(--hostile)" : "var(--ink-faint)");
    return '<div class="turn-meta" style="color:' + toneVar + '">&Delta; ' + sign + delta + ' &middot; ' + escapeHtml(label) + '</div>';
  }

  function renderMessages(messages, visitorName) {
    return messages.map(function (m) {
      if (m.role === "narrator") {
        return '<div class="narrator-row"><p class="narrator-text' + (m.isError ? " error-text" : "") + '">' + escapeHtml(m.text) + '</p></div>';
      }
      var who = m.role === "visitor" ? visitorName : "Du";
      var meta = (m.role === "player" && m.delta != null) ? turnMetaHtml(m.metaLabel || "", m.delta) : "";
      return (
        '<div class="bubble-row ' + m.role + '"><div class="bubble-col"><div class="bubble">' +
          '<span class="bubble-name">' + who + '</span>' + escapeHtml(m.text) +
        '</div>' + meta + '</div></div>'
      );
    }).join("");
  }

  function typingIndicatorHtml(visitorName) {
    return (
      '<div class="bubble-row visitor"><div class="bubble-col"><div class="bubble">' +
        '<span class="bubble-name">' + visitorName + '</span>' +
        '<span class="typing-dots" aria-label="' + visitorName + ' skriver ett svar"><span></span><span></span><span></span></span>' +
      '</div></div></div>'
    );
  }

  function renderSession() {
    var v = state.visitor, s = state.session;
    var band = bandOf(s.anger);
    var colorVar = "var(" + BAND_COLOR_VAR[band] + ")";
    var bubbles = renderMessages(s.messages, v.name) + (s.pending ? typingIndicatorHtml(v.name) : "");
    var draft = s.draftText || "";
    s.draftText = null;
    var locked = s.ended || s.pending;

    rootEl.innerHTML =
      '<div class="session">' +
        '<aside class="case-file">' +
          '<h3>' + v.name + ', ' + v.age + '</h3>' +
          '<span class="case-tag">' + v.tag + '</span>' +
          '<div class="meter-label"><span>' + (v.meterLabel || "Temperament") + '</span><span class="mono">' + s.anger + '%</span></div>' +
          '<div class="meter-track"><div class="meter-fill" style="width:' + s.anger + '%; background:' + colorVar + '"></div></div>' +
          '<div class="meter-band" style="color:' + colorVar + '">' + bandLabelFor(v, band) + '</div>' +
          '<div class="turn-count">Replik <span class="mono">' + Math.min(s.turn + 1, s.maxTurns) + '</span> av <span class="mono">' + s.maxTurns + '</span></div>' +
          '<button class="btn btn-ghost" id="abort-btn" type="button"' + (locked ? " disabled" : "") + '>Avsluta samtal</button>' +
        '</aside>' +
        '<div class="chat-panel">' +
          '<div class="chat-log" id="chat-log" aria-live="polite">' + bubbles + '</div>' +
          '<div class="composer">' +
            '<label for="reply-input" class="visually-hidden">Ditt svar till ' + v.name + '</label>' +
            '<textarea id="reply-input" rows="2" placeholder="' + (s.pending ? "Väntar på svar…" : "Skriv ditt svar…") + '"' + (locked ? " disabled" : "") + '>' + escapeHtml(draft) + '</textarea>' +
            (!s.ended && SpeechRec
              ? '<button class="btn mic-btn" id="mic-btn" type="button" aria-pressed="false" title="Prata in ditt svar"' + (locked ? " disabled" : "") + '>' + MIC_ICON + '<span class="mic-label">Prata</span></button>'
              : '') +
            (s.ended
              ? '<button class="btn btn-primary" id="report-btn" type="button">Se rapport</button>'
              : '<button class="btn btn-primary" id="send-btn" type="button"' + (s.pending ? " disabled" : "") + '>Skicka</button>') +
          '</div>' +
          (s.ended ? '' : micBarHtml(locked)) +
        '</div>' +
      '</div>';

    var log = document.getElementById("chat-log");
    log.scrollTop = log.scrollHeight;

    if (!s.ended) {
      var input = document.getElementById("reply-input");
      var send = document.getElementById("send-btn");
      function submit() {
        if (s.pending) return;
        var text = input.value.trim();
        if (!text) return;
        handlePlayerMessage(text);
      }
      if (!s.pending) {
        wireMic(input, submit);
        send.addEventListener("click", submit);
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
        });
        input.focus();
      }
      document.getElementById("abort-btn").addEventListener("click", function () {
        if (s.pending) return;
        finishSession(s.anger <= 40 ? "improved" : "unresolved");
      });
    } else {
      document.getElementById("report-btn").addEventListener("click", function () {
        state.view = "report"; render();
      });
    }
  }

  function handlePlayerMessage(text) {
    if (aiConfig.enabled) handlePlayerMessageAI(text);
    else handlePlayerMessageRules(text);
  }

  function handlePlayerMessageRules(text) {
    var v = state.visitor, s = state.session;
    var ctx = v.consequenceAfterTurn != null
      ? { consequenceAware: true, consequenceOk: s.turn >= v.consequenceAfterTurn }
      : null;
    var result = analyzeMessage(text, ctx);
    // Vissa besökare (t.ex. gruppen) lyssnar inte riktigt på de första tillsägelserna.
    if (v.stubbornTurns && s.turn < v.stubbornTurns && result.delta < 0) {
      result.delta = Math.round(result.delta * 0.4);
      result.stubborn = true;
    }
    addTally(s, result.tags);
    s.messages.push({ role: "player", text: text, delta: result.delta, metaLabel: tagsToLabel(result.tags) + (result.stubborn ? " (de lyssnar inte riktigt än)" : "") });
    s.turn += 1;
    var newAnger = clamp(s.anger + result.delta, 0, 100);
    s.anger = newAnger;
    s.angerHistory.push(newAnger);

    var endingKey = null;
    if (newAnger <= 15 && s.turn >= 2) endingKey = "resolved";
    else if (newAnger >= 95) endingKey = "escalated";
    else if (s.turn >= s.maxTurns) endingKey = newAnger <= 40 ? "improved" : "unresolved";

    if (endingKey) {
      finishSession(endingKey);
      return;
    }
    var band = bandOf(newAnger);
    var line = pickLine(v, band, s);
    s.messages.push({ role: "visitor", text: line });
    render();
  }

  async function handlePlayerMessageAI(text) {
    var v = state.visitor, s = state.session;
    var playerMsg = { role: "player", text: text, delta: null, metaLabel: null };
    s.messages.push(playerMsg);
    s.pending = true;
    render();

    try {
      var out = await callVisitorTurn(v, s, text);
      var prevAnger = s.anger;
      var newAnger = clamp(Math.round(out.anger), 0, 100);
      var delta = newAnger - prevAnger;
      playerMsg.delta = delta;
      playerMsg.metaLabel = out.signal || (delta <= 0 ? "Sänkte temperamentet" : "Höjde temperamentet");
      s.turn += 1;
      s.anger = newAnger;
      s.angerHistory.push(newAnger);
      s.pending = false;

      var endingKey = null;
      if (out.resolved && s.turn >= 2) endingKey = "resolved";
      else if (newAnger >= 95) endingKey = "escalated";
      else if (s.turn >= s.maxTurns) endingKey = newAnger <= 40 ? "improved" : "unresolved";

      s.messages.push({ role: "visitor", text: out.reply || "…" });

      if (endingKey) {
        var narrative = (out.endingNarrative && out.endingNarrative.trim()) || fallbackEndingNarrative(v, endingKey);
        finishSession(endingKey, narrative);
      } else {
        render();
      }
    } catch (err) {
      s.messages.pop(); // drop the unanswered player bubble so it doesn't look silently ignored
      s.draftText = text;
      s.pending = false;
      s.messages.push({ role: "narrator", text: "⚠ " + err.message, isError: true });
      render();
    }
  }

  function finishSession(endingKey, narrativeOverride) {
    var v = state.visitor, s = state.session;
    s.ended = true;
    s.endingKey = endingKey;
    s.endingNarrative = narrativeOverride || v.endings[endingKey];
    s.messages.push({ role: "narrator", text: s.endingNarrative });
    render();
  }

  var END_META = {
    resolved: { label: "Löst", color: "--calm" },
    improved: { label: "Delvis förbättrat", color: "--agitated" },
    unresolved: { label: "Olöst", color: "--agitated" },
    escalated: { label: "Eskalerade", color: "--hostile" }
  };

  async function fetchDebrief(v, s) {
    s.debriefLoading = true;
    s.debriefError = null;
    render();
    try {
      var transcript = buildTranscript(s);
      var userContent =
        "Här är hela samtalet (Besökaren = rollspelad besökare, Bibliotekarien = personen som övar):\n\n" + transcript +
        "\n\nSamtalet slutade med utfallet: " + END_META[s.endingKey].label + ". Ge kort träningsfeedback.";
      var out = await anthropicToolCall(
        "Du är en hänsynsfull handledare som ger träningsfeedback till bibliotekspersonal efter ett rollspel med en besökare (upprörd eller regelbrytande). Svara alltid på svenska, konkret och konstruktivt, genom verktyget debrief.",
        userContent,
        DEBRIEF_TOOL
      );
      s.debrief = out;
    } catch (err) {
      s.debriefError = err.message;
    }
    s.debriefLoading = false;
    if (state.view === "report" && state.session === s) render();
  }

  function renderReport() {
    var v = state.visitor, s = state.session;
    var meta = END_META[s.endingKey];
    var colorVar = "var(" + meta.color + ")";

    // sparkline
    var w = 100, h = 100, pad = 6;
    var pts = s.angerHistory.map(function (val, i) {
      var x = pad + (i / Math.max(1, s.angerHistory.length - 1)) * (w - pad * 2);
      var y = pad + (1 - val / 100) * (h - pad * 2);
      return [x, y];
    });
    var pathD = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var areaD = pathD + " L" + pts[pts.length - 1][0].toFixed(1) + "," + (h - pad) + " L" + pts[0][0].toFixed(1) + "," + (h - pad) + " Z";
    var last = pts[pts.length - 1];
    var gridLines = [0.25, 0.5, 0.75].map(function (f) {
      var y = pad + f * (h - pad * 2);
      return '<line x1="' + pad + '" y1="' + y.toFixed(1) + '" x2="' + (w - pad) + '" y2="' + y.toFixed(1) + '" class="spark-grid" />';
    }).join("");

    var svg =
      '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Temperament över samtalets gång, från ' + s.angerHistory[0] + ' till ' + s.angerHistory[s.angerHistory.length - 1] + ' procent">' +
        '<style>.spark-grid{stroke:var(--line);stroke-width:0.6;}</style>' +
        gridLines +
        '<path d="' + areaD + '" fill="' + colorVar + '" opacity="0.12" stroke="none" />' +
        '<path d="' + pathD + '" fill="none" stroke="' + colorVar + '" stroke-width="2" vector-effect="non-scaling-stroke" />' +
        '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.6" fill="' + colorVar + '" />' +
      '</svg>';

    var usedAiForThisSession = aiConfig.enabled || s.debrief || s.debriefLoading || s.debriefError;
    var tallyHtml, tipHtml;

    if (usedAiForThisSession) {
      if (s.debriefLoading || (!s.debrief && !s.debriefError)) {
        tallyHtml =
          '<div class="tally-cols">' +
            '<div class="tally-col"><h4>Styrkor i ditt bemötande</h4><ul class="debrief-list"><li class="tally-empty">Hämtar återkoppling…</li></ul></div>' +
            '<div class="tally-col"><h4>Att jobba vidare med</h4><ul class="debrief-list"><li class="tally-empty">Hämtar återkoppling…</li></ul></div>' +
          '</div>';
        tipHtml = "";
      } else if (s.debriefError) {
        tallyHtml = "";
        tipHtml = '<div class="tip-box err"><strong>Kunde inte hämta AI-återkoppling:</strong> ' + escapeHtml(s.debriefError) + ' <button class="btn btn-ghost" id="retry-debrief-btn" type="button">Försök igen</button></div>';
      } else {
        var strengthsHtml = (s.debrief.strengths || []).map(function (t) { return '<li><span class="tally-name">' + escapeHtml(t) + '</span></li>'; }).join("") || '<li class="tally-empty">Inget särskilt noterat.</li>';
        var growthHtml = (s.debrief.growth || []).map(function (t) { return '<li><span class="tally-name">' + escapeHtml(t) + '</span></li>'; }).join("") || '<li class="tally-empty">Inget särskilt noterat.</li>';
        tallyHtml =
          '<div class="tally-cols">' +
            '<div class="tally-col"><h4>Styrkor i ditt bemötande</h4><ul class="debrief-list">' + strengthsHtml + '</ul></div>' +
            '<div class="tally-col"><h4>Att jobba vidare med</h4><ul class="debrief-list">' + growthHtml + '</ul></div>' +
          '</div>';
        tipHtml = '<div class="tip-box"><strong>Tips till nästa försök:</strong> ' + escapeHtml(s.debrief.tip) + '</div>';
      }
    } else {
      var posKeys = ["empathy", "apology", "solution", "question", "polite", "rule", "consequence"];
      var negKeys = ["dismiss", "minimize", "blame", "threat", "argue", "insult", "capsShout", "short"];
      var tallyList = function (keys) {
        var items = keys.filter(function (k) { return s.tally[k]; })
          .sort(function (a, b) { return s.tally[b] - s.tally[a]; })
          .map(function (k) { return '<li><span class="tally-name">' + TAG_LABELS[k] + '</span><span class="tally-count mono">' + s.tally[k] + '</span></li>'; })
          .join("");
        return items || '<li class="tally-empty">Inga registrerade den här gången.</li>';
      };
      tallyHtml =
        '<div class="tally-cols">' +
          '<div class="tally-col"><h4>Styrkor i ditt bemötande</h4><ul>' + tallyList(posKeys) + '</ul></div>' +
          '<div class="tally-col"><h4>Att jobba vidare med</h4><ul>' + tallyList(negKeys) + '</ul></div>' +
        '</div>';
      var topNeg = negKeys.filter(function (k) { return s.tally[k]; }).sort(function (a, b) { return s.tally[b] - s.tally[a]; })[0];
      if (topNeg) {
        tipHtml = '<div class="tip-box"><strong>Tips till nästa försök:</strong> ' + ADVICE[topNeg] + '</div>';
      } else {
        tipHtml = '<div class="tip-box"><strong>Bra jobbat:</strong> Du undvek de vanligaste eskalerande fällorna den här gången. Testa en besökare med högre svårighetsgrad härnäst.</div>';
      }
    }

    rootEl.innerHTML =
      '<div class="report-card">' +
        '<span class="end-banner" style="background:color-mix(in srgb, ' + colorVar + ' 16%, transparent); color:' + colorVar + '"><span class="dot" style="background:' + colorVar + '"></span>' + meta.label + '</span>' +
        '<h2>Samtalet med ' + v.name + ' är avslutat</h2>' +
        '<p class="report-narrative">' + escapeHtml(s.endingNarrative || v.endings[s.endingKey]) + '</p>' +
        '<div class="spark-wrap"><div class="meter-label"><span>' + (v.meterLabel || "Temperament") + ' under samtalet</span><span class="mono">' + s.angerHistory[0] + '% → ' + s.angerHistory[s.angerHistory.length - 1] + '%</span></div>' + svg + '</div>' +
        tallyHtml +
        tipHtml +
        '<div class="report-actions">' +
          '<button class="btn btn-primary" id="retry-btn" type="button">Försök igen med ' + v.name + '</button>' +
          '<button class="btn btn-ghost" id="home-btn" type="button">Alla besökare</button>' +
        '</div>' +
        '<details class="transcript-toggle"><summary>Visa hela samtalet och vad som registrerades</summary>' +
          '<div class="transcript-log">' + renderMessages(s.messages, v.name) + '</div>' +
        '</details>' +
      '</div>';

    document.getElementById("retry-btn").addEventListener("click", function () {
      state.session = newSession(v);
      state.view = "session";
      render();
    });
    document.getElementById("home-btn").addEventListener("click", function () {
      state.view = "home"; render();
    });
    var retryDebriefBtn = document.getElementById("retry-debrief-btn");
    if (retryDebriefBtn) retryDebriefBtn.addEventListener("click", function () { fetchDebrief(v, s); });

    if (aiConfig.enabled && !s.debrief && !s.debriefLoading && !s.debriefError) {
      fetchDebrief(v, s);
    }
  }

  render();
})();
</script>
